name: CI

# Solo en pull_request, no en push: el historial tiene muchos commits de
# checkpoint automáticos (Cline), correr esto en cada push sería ruido.
on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
