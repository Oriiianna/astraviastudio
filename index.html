<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080012" />

    <title>Astravia Studio — Sitios y aplicaciones web a medida</title>
    <meta
      name="description"
      content="Equipo de diseño y desarrollo web. Creamos sitios y aplicaciones a medida: rápidos, pensados para convertir visitas en consultas y listos para crecer."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Redes sociales: es la tarjeta que se ve al pegar el link en WhatsApp,
         LinkedIn o Slack. La imagen la genera scripts/optimize-og.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Astravia Studio" />
    <meta property="og:locale" content="es_AR" />
    <meta
      property="og:title"
      content="Astravia Studio — Sitios y aplicaciones web a medida"
    />
    <meta
      property="og:description"
      content="Equipo de diseño y desarrollo web. Creamos sitios y aplicaciones a medida: rápidos, pensados para convertir visitas en consultas y listos para crecer."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Astravia Studio — Sitios y aplicaciones web a medida"
    />
    <meta
      name="twitter:description"
      content="Equipo de diseño y desarrollo web. Creamos sitios y aplicaciones a medida: rápidos, pensados para convertir visitas en consultas y listos para crecer."
    />

    <!-- Open Graph: la tarjeta que se ve al pegar el link en WhatsApp,
         LinkedIn o Slack. Requiere URL absoluta; la imagen la genera
         scripts/optimize-og.mjs → public/brand/og-astravia.jpg. -->
    <link rel="canonical" href="https://astraviastudio.com.ar/" />
    <meta property="og:url" content="https://astraviastudio.com.ar/" />
    <meta property="og:image" content="https://astraviastudio.com.ar/brand/og-portada.png" />
    <meta property="og:image:width" content="5296" />
    <meta property="og:image:height" content="4752" />
    <meta property="og:image:alt" content="Astravia Studio — Sitios y aplicaciones web a medida" />
    <meta name="twitter:image" content="https://astraviastudio.com.ar/brand/og-portada.png" />

    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/isotipo-astravia.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Datos estructurados: es lo que lee Google para armar el panel lateral
         y entender de qué se trata el negocio. Cuando haya dominio, agregar
         "url" y "logo" con la URL absoluta. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Astravia Studio",
        "url": "https://astraviastudio.com.ar",
        "logo": "https://astraviastudio.com.ar/brand/isotipo-astravia.png",
        "image": "https://astraviastudio.com.ar/brand/og-astravia.jpg",
        "description": "Equipo de diseño y desarrollo de sitios y aplicaciones web a medida.",
        "email": "astraviastudio@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Buenos Aires",
          "addressCountry": "AR"
        },
        "areaServed": "Global",
        "availableLanguage": ["es", "en"],
        "knowsAbout": [
          "Diseño UI/UX",
          "Desarrollo web",
          "Aplicaciones web",
          "React",
          "WordPress",
          "Optimización de rendimiento web",
          "SEO técnico"
        ]
      }
    </script>
    <!-- Google tag (gtag.js) para medir metricas -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-3MC7WMBBX0"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-3MC7WMBBX0");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
